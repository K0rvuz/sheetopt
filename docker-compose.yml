services:
  sheetopt:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SHEETOPT_ADMIN_TOKEN: ${SHEETOPT_ADMIN_TOKEN:?Set a 32+ character admin token in .env}
      SHEETOPT_ENCRYPTION_KEY: ${SHEETOPT_ENCRYPTION_KEY:?Set a Fernet key in .env}
      SHEETOPT_DATA_DIR: /data
    volumes:
      - sheetopt_data:/data
    restart: unless-stopped

volumes:
  sheetopt_data:
