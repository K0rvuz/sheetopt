[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sheetopt"
version = "0.1.0"
description = "Open-source deterministic analyzer and optimizer foundation for Google Sheets"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SheetOpt contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "typer>=0.12,<1",
  "rich>=13.9,<15",
  "google-api-python-client>=2.149,<3",
  "google-auth>=2.35,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
sheetopt = "sheetopt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetopt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
